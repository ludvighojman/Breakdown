name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  xlam:
    name: Excel add-in (.xlam) build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/xlam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/xlam/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test build tooling
        run: npm test

      - name: Check dist/Breakdown.xlam matches src/
        run: npm run check
